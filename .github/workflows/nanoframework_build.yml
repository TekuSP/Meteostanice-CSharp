name: Build Nanoframework

on: [push, pull_request, workflow_dispatch]

defaults:
  run:
    shell: pwsh
jobs:
  Build:
    strategy:
      matrix:
        configuration: [Debug, Release]
    name: Build NanoFramework SLN
    timeout-minutes: 15
    runs-on: windows-latest
    concurrency:
      group: build-${{github.ref}}-${{matrix.configuration}}
      cancel-in-progress: true
    env:
      solution: 'Meteostanice.sln'
      major: '0'
      minor: '4'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
          
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.

      - name: Setup MSBuild Path
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      # https://github.com/NuGet/setup-nuget
      - name: Install NuGet client
        uses: nuget/setup-nuget@v4.0
        with:
          nuget-version: 'latest'
          
      - name: Install Nanoframework Extension
        uses: nanoframework/nanobuild@v1.20
        with:
          usePreview: true
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.githubAuth }}

      - name: Cache and restore nugets
        uses: actions/cache@v6
        with:
          path: ${{runner.workspace}}\Nanoframework-Drivers\packages
          key: ${{ runner.os }}-${{ runner.arch }}-build-${{ github.workflow }}-${{ github.ref }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
             ${{ runner.os }}-${{ runner.arch }}-build-${{ github.workflow }}-${{ github.ref }}-
             ${{ runner.os }}-${{ runner.arch }}-build-${{ github.workflow }}-
          
      - name: Restore nugets
        run: nuget restore ${{ env.solution }} -ConfigFile nuget.config -LockedMode
        
      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v6
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner
          
      - name: Build Nanoframework and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          Configuration: ${{ matrix.configuration }}
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin /k:"TekuSP_Meteostanice-CSharp" /o:"tekusp" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.scanner.scanAll=false /d:sonar.host.url="https://sonarcloud.io"
           msbuild ${{ env.solution }} /p:Configuration=$env:Configuration
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
      
      - name: Prepare nuget version ${{ env.major }}.${{ env.minor }}.${{ github.run_number }}
        uses: richardrigutins/replace-in-files@v3
        with:
          files: '**/*.nuspec'
          search-text: '$version$'
          replacement-text: '${{ env.major }}.${{ env.minor }}.${{ github.run_number }}'
          encoding: 'utf8'
          max-parallelism: 10
      
      - name: Pack nugets
        run: ./GenerateNugets.ps1
        if: ${{ matrix.configuration == 'Release' }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        if: ${{ matrix.configuration == 'Release' }}
        with:
          name: TekuSP-Drivers
          path: |
            ${{ github.workspace }}\**\*TekuSP*.nupkg
