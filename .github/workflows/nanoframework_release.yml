name: Release Nanoframework

on:
  release:
    types: [published]
  push:
    branches:
      - master
    paths:
      - VERSION
  workflow_call:
    inputs:
      prerelease:
        description: 'Publish as a prerelease'
        required: false
        type: boolean
        default: true
      version:
        description: 'Optional SemVer version without leading v'
        required: false
        type: string
        default: ''

defaults:
  run:
    shell: pwsh
    
permissions:
  checks: write
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version || github.sha }}
  cancel-in-progress: true

jobs:
  Build:
    name: Build NanoFramework SLN
    timeout-minutes: 15
    runs-on: windows-latest
    env:
      solution: 'Meteostanice.sln'
      Configuration: Release
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.

      - name: Setup MSBuild Path
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      # https://github.com/NuGet/setup-nuget
      - name: Install NuGet client
        uses: nuget/setup-nuget@v4.0
        with:
          nuget-version: 'latest'
          
      - name: Install Nanoframework Extension
        uses: nanoframework/nanobuild@v1.20
        with:
          usePreview: true
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.githubAuth }}

      - name: Cache and restore nugets
        uses: actions/cache@v6
        with:
          path: ${{runner.workspace}}\Nanoframework-Drivers\packages
          key: ${{ runner.os }}-${{ runner.arch }}-build-${{ github.workflow }}-${{ github.ref }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
             ${{ runner.os }}-${{ runner.arch }}-build-${{ github.workflow }}-${{ github.ref }}-
             ${{ runner.os }}-${{ runner.arch }}-build-${{ github.workflow }}-
          
      - name: Restore nugets
        run: nuget restore ${{ env.solution }} -ConfigFile nuget.config -LockedMode
        
      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v6
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner
          
      - name: Build Nanoframework and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin /k:"TekuSP_Meteostanice-CSharp" /o:"tekusp" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.scanner.scanAll=false /d:sonar.host.url="https://sonarcloud.io"
           msbuild ${{ env.solution }} /p:Configuration=$env:Configuration
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
      
      - name: Set version environment variable
        run: |
          $eventName = "${{ github.event_name }}"
          $tagName = "${{ github.event.release.tag_name }}"
          $version = "${{ inputs.version }}"
          $tagNameWasProvided = -not [string]::IsNullOrWhiteSpace($tagName)
          $releaseIsPrerelease = $false

          if ($eventName -eq "release") {
              $releaseIsPrerelease = "${{ github.event.release.prerelease }}" -ieq "true"
              $version = $tagName
          } else {
              $releaseIsPrerelease = "${{ inputs.prerelease }}" -ieq "true"
              if ($eventName -eq "push") {
                  $releaseIsPrerelease = $true
              }

              if ([string]::IsNullOrWhiteSpace($version)) {
                  if (Test-Path "VERSION") {
                      $version = (Get-Content "VERSION" -Raw).Trim()
                  } else {
                      throw "VERSION file is required when no release tag or version input is provided."
                  }
              }
          }

          # Check if the tag starts with 'v' and remove it for NuGet package version.
          if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
          }

          if ([string]::IsNullOrWhiteSpace($tagName)) {
              $tagName = "v$version"
          }

          # Default generated prereleases to the shared preview suffix when the user did not provide another suffix.
          # A supplied prerelease suffix is a hyphen followed by alphanumeric/hyphen segments separated by dots.
          if ($releaseIsPrerelease -and $version -notmatch "-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$") {
              $version = "$version-preview"

              if (-not $tagNameWasProvided) {
                  $tagName = "v$version"
              }
          }
           
          Write-Host "The event name is: $eventName"
          Write-Host "The release tag name is: $tagName"
          Write-Host "The release prerelease flag is: $releaseIsPrerelease"
          Write-Host "The processed version is: $version"
           
          # Set the environment variable for subsequent steps in the same job
          echo "version=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "tagName=$tagName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "releaseIsPrerelease=$releaseIsPrerelease" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh # Explicitly use PowerShell Core (default on windows-latest for 'run')

      
      - name: Prepare nuget version ${{ env.version }}
        uses: richardrigutins/replace-in-files@v3
        with:
          files: '**/*.nuspec'
          search-text: '$version$'
          replacement-text: '${{ env.version }}'
          encoding: 'utf8'
          max-parallelism: 10
      
      - name: Pack nugets
        run: ./GenerateNugets.ps1

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: TekuSP
    
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: TekuSP-Drivers
          path: |
            ${{ github.workspace }}/**/*TekuSP*.nupkg

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tagName }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.releaseIsPrerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ github.workspace }}/**/*TekuSP*.nupkg

      - name: Push nugets to GitHub
        run: |
          nuget sources Add -Name github -Source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json -UserName ${{ github.repository_owner }} -Password ${{ secrets.GITHUB_TOKEN }}
          nuget push "**/*TekuSP*.nupkg" -Source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json -NoSymbols -SkipDuplicate -ApiKey ${{ secrets.GITHUB_TOKEN }}

      - name: Push nugets to Nuget.org
        run: |
          nuget push "**/*TekuSP*.nupkg" -ApiKey ${{steps.login.outputs.NUGET_API_KEY}} -Source https://api.nuget.org/v3/index.json -NoSymbols -SkipDuplicate
